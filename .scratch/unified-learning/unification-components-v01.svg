#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.917" x="208.623" y="409.1426">verified import</text><polygon fill="#181818" points="465.3911,431.5879,466.0615,421.7619,463.6762,426.8912,458.5468,424.5058,465.3911,431.5879" style="stroke:#181818;stroke-width:1;"/><path d="M438.2103,357.1494 C445.4024,376.846 454.9529,403.0015 463.3332,425.9518 " fill="none" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.8477" x="459.623" y="409.1426">replaces bundle</text><rect fill="none" height="115.6563" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="535.2461" x="12" y="495.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="460.7012" x="17" y="515.1426">Proposed dependencies, not runtime execution order. All files stay private.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.584" x="17" y="532.752">S1: exercise public commands; assert returned results, files and installed behavior.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="399.9502" x="17" y="550.3613">Real temporary files / Git; controlled release / remote responses.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="525.2461" x="17" y="567.9707">Migration requires report reconciliation, rehearsal, preservation and recovery checks.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="318.2744" x="17" y="585.5801">Ordinary updates never reorganize learner records.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="501.2109" x="17" y="603.1895">Portable teaching evaluation