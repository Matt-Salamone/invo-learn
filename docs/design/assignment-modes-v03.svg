" y="533.2129">Yes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="17.8965" x="374.0413" y="533.2129">No</text><rect fill="#F1F1F1" height="55.2188" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.2607" x="11" y="558.2891"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.2607" x="21" y="582.8223">Chatbot guides; learner edits and runs;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.9648" x="21" y="600.4316">record actual assistance</text><rect fill="#F1F1F1" height="37.6094" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="234.7988" x="292.2607" y="558.2891"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.7988" x="302.2607" y="582.8223">Learner implements independently</text><polygon fill="#F1F1F1" points="275.6453,619.5078,287.6453,631.5078,275.6453,643.5078,263.6453,631.5078,275.6453,619.5078" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="55.2188" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="227.7715" x="161.7595" y="663.5078"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.2334" x="171.7595" y="688.041">Update assignment progress and</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.7715" x="171.7595" y="705.6504">shared course evidence / reviews</text><ellipse cx="275.6453" cy="749.7266" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="275.6453" cy="749.7266" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.6453" x2="275.6453" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="271.6453,78.6094,275.6453,88.6094,279.6453,78.6094,275.6453,82.60